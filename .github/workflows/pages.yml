name: Validate personal website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build website and refresh published files
        run: npm run publish:prepare
      - name: Validate pages and internal links
        run: npm run check
      - name: Check JavaScript syntax
        run: node --check src/site.js
      - name: Verify published files match source
        run: |
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
